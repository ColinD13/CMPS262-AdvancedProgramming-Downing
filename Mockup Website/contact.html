    <main>
        <div class="content">
            <h1>Contact Us</h1>
            
            <div class="under-hero">
                <div class="in-sub-level-form">
                    <form id="contact-form">
                        <div class="form-group">
                            <label for="nameEntry">Name:</label>
                            <input type="text" id="nameEntry" name="nameEntry"><br>
                        </div>
                        <div class="form-group">
                            <label for="emailEntry">Email:</label>
                            <input type="email" id="emailEntry" name="emailEntry"><br>
                        </div>
                        <div class="form-group">
                            <label for="messageEntry">Message:</label>
                            <input type="text" id="messageEntry" name="messageEntry">
                        </div>
                        <button type="submit" class="submit-btn">Contact</button>
                    </form>
                </div>
            </div>

        </div>
    </main>
